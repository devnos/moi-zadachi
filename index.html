<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f1"><title>Мои задачи</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Prata&display=swap');
:root{color-scheme:light;--bg:#f1f0eb;--paper:#fffefa;--ink:#20242c;--muted:#777d85;--line:#e6e6e0;--field:#f6f6f2;--accent:#315be8;--accent-hover:#244ad0;--shadow:0 24px 70px rgba(36,40,55,.08)}
html[data-theme="dark"]{color-scheme:dark;--bg:#171b23;--paper:#222731;--ink:#f2f2ee;--muted:#a7acb5;--line:#3a404a;--field:#292f3a;--accent:#7191ff;--accent-hover:#91aaff;--shadow:0 24px 70px rgba(0,0,0,.18)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #8fa8ff;outline-offset:3px}main{max-width:760px;margin:auto;padding:52px 24px 72px}header{margin-bottom:38px}.header-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:26px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.theme-toggle{width:46px;height:46px;display:grid;place-items:center;flex:none;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--ink);transition:transform .2s,border-color .2s}.theme-toggle:hover{transform:rotate(-12deg);border-color:var(--muted)}h1{font:400 clamp(42px,8vw,68px)/1.1 Prata,Georgia,serif;letter-spacing:-.055em;margin:42px 0 14px}h1 span{color:var(--accent)!important}header p{margin:0;color:var(--muted);font-size:15px}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:var(--shadow)}form{display:flex;gap:10px}#task{min-width:0;flex:1;height:58px;background:var(--field);color:var(--ink);border:1px solid transparent;border-radius:12px;padding:0 18px}#task::placeholder{color:var(--muted)}#task:focus{border-color:var(--accent)}form button{height:58px;border:0;border-radius:12px;padding:0 24px;background:var(--accent);color:#fff;font-weight:800;transition:background .2s,transform .2s}html[data-theme="dark"] form button{color:#111b42}form button:hover{background:var(--accent-hover)}form button:active{transform:scale(.98)}.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:40px 0 12px}.list-head span:first-child{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--ink)}#count{color:var(--muted);font-size:12px;font-weight:700}ul{list-style:none;margin:0;padding:0}li{display:flex;align-items:center;gap:14px;min-height:68px;border-top:1px solid var(--line)}li input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--accent);cursor:pointer}li label{flex:1;cursor:pointer;overflow-wrap:anywhere;font-weight:600}li.done label{color:var(--muted);text-decoration:line-through}.delete{width:42px;height:42px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:24px;line-height:1}.delete:hover{background:var(--field);color:var(--ink)}.empty{text-align:center;padding:42px 10px 24px;color:var(--muted);font-size:14px}.empty strong{display:block;margin-bottom:6px;color:var(--ink);font-size:16px}footer{padding-top:22px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:480px){main{padding:26px 18px 48px}.header-top{padding-bottom:19px}h1{margin-top:34px}.card{padding:21px;border-radius:20px}form{flex-wrap:wrap}#task{flex-basis:100%}form button{width:100%}.list-head{margin-top:32px}.eyebrow{font-size:10px;letter-spacing:.12em}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}

</style>
</head>
<body><main><header><div class="header-top"><div class="eyebrow">Личное пространство</div><button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Тёмная тема</button></div><h1>Мои задачи<span style="color:#7ca989">.</span></h1><p>Всё важное - в одном месте</p></header><section class="card" aria-label="Список задач"><form id="form"><input id="task" aria-label="Новая задача" placeholder="Что нужно сделать?" maxlength="300" autocomplete="off" required><button>Добавить</button></form><div class="list-head"><span>МОИ ЗАДАЧИ</span><span id="count"></span></div><ul id="list"></ul><div id="empty" class="empty"><strong>Начните с одной задачи</strong>Запишите то, что хотите сделать</div></section><footer>Ваши задачи сохраняются на этом устройстве</footer></main>
<script>
const form=document.querySelector('#form'), input=document.querySelector('#task'), list=document.querySelector('#list'), empty=document.querySelector('#empty'), count=document.querySelector('#count');
const themeButton=document.querySelector('#theme-toggle');
let theme='light';
try { if(localStorage.getItem('theme')==='dark') theme='dark' } catch {}
const icons={moon:'<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>',sun:'<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>'};
function applyTheme(){document.documentElement.dataset.theme=theme;themeButton.innerHTML=theme==='dark'?icons.sun:icons.moon;themeButton.setAttribute('aria-label',theme==='dark'?'Включить светлую тему':'Включить тёмную тему');themeButton.setAttribute('title',theme==='dark'?'Включить светлую тему':'Включить тёмную тему');themeButton.setAttribute('aria-pressed',String(theme==='dark'))}
themeButton.onclick=()=>{theme=theme==='dark'?'light':'dark';try{localStorage.setItem('theme',theme)}catch{}applyTheme()};
applyTheme();
let tasks=[];
try { const saved=JSON.parse(localStorage.getItem('my-tasks')||'[]'); if(Array.isArray(saved)) tasks=saved.filter(t=>typeof t.text==='string'&&typeof t.done==='boolean'); } catch {}
function render(){list.replaceChildren();for(const [index,task] of tasks.entries()){const li=document.createElement('li'), check=document.createElement('input'), label=document.createElement('label'), del=document.createElement('button');li.classList.toggle('done',task.done);check.type='checkbox';check.checked=task.done;check.id='task-'+index;check.setAttribute('aria-label','Отметить задачу: '+task.text);check.onchange=()=>{task.done=check.checked;save()};label.htmlFor=check.id;label.textContent=task.text;del.className='delete';del.type='button';del.textContent='×';del.setAttribute('aria-label','Удалить задачу: '+task.text);del.onclick=()=>{tasks.splice(index,1);save()};li.append(check,label,del);list.append(li)}empty.hidden=tasks.length>0;count.textContent=tasks.filter(t=>!t.done).length+' осталось'}
function save(){try{localStorage.setItem('my-tasks',JSON.stringify(tasks))}catch{alert('Не удалось сохранить задачи на устройстве')}render()}
form.onsubmit=e=>{e.preventDefault();const text=input.value.trim();if(!text)return;tasks.push({text,done:false});input.value='';save();input.focus()};render();
</script></body></html>
