<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f1"><title>Мои задачи</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f1;color:#202821;font:16px system-ui,-apple-system,sans-serif}main{max-width:620px;margin:0 auto;padding:64px 20px}header{margin-bottom:32px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:#68816b}h1{font-size:clamp(36px,8vw,52px);letter-spacing:-.045em;line-height:1.1;margin:12px 0}header p{color:#768078;margin:0}.card{background:white;border:1px solid #e6eae4;border-radius:22px;padding:22px;box-shadow:0 16px 45px #263f2910}form{display:flex;gap:10px}input{min-width:0;flex:1;border:1px solid #dce4db;border-radius:12px;padding:15px;font:inherit;outline:none}input:focus{border-color:#598567;box-shadow:0 0 0 3px #dcece0}button{font:inherit;cursor:pointer}form button{border:0;border-radius:12px;background:#2563eb;color:white;font-weight:700;padding:0 20px}form button:hover{background:#1d4ed8}.list-head{display:flex;justify-content:space-between;align-items:center;margin:30px 0 10px;font-size:13px;font-weight:700;color:#758076}.list-head span:first-child{color:#35453a}ul{padding:0;margin:0;list-style:none}li{display:flex;align-items:center;gap:12px;border-top:1px solid #eef1ed;padding:15px 0}li input{flex:none;width:21px;height:21px;accent-color:#4d805a;margin:0;cursor:pointer}li label{flex:1;overflow-wrap:anywhere;cursor:pointer}li.done label{text-decoration:line-through;color:#9ca69e}.delete{border:0;background:transparent;color:#98a49a;padding:8px;border-radius:8px;font-size:22px;line-height:1}.delete:hover{background:#f7eeee;color:#a44141}.empty{text-align:center;color:#89958b;padding:35px 8px 24px}.empty strong{display:block;color:#536457;margin-bottom:7px}footer{text-align:center;color:#9aa59b;font-size:12px;margin-top:24px}@media(max-width:480px){main{padding-top:42px}.card{padding:16px}form button{padding:0 14px}}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.theme-toggle{flex:none;border:1px solid #dce4db;border-radius:10px;background:#fff;color:#35453a;padding:9px 12px;font-size:13px;font-weight:700}button:focus-visible{outline:3px solid #77a8ff;outline-offset:2px}html[data-theme="dark"]{color-scheme:dark}html[data-theme="dark"] body{background:#151b20;color:#edf2f5}html[data-theme="dark"] .card{background:#202a32;border-color:#35434d;box-shadow:0 16px 45px #0003}html[data-theme="dark"] .theme-toggle{background:#27343d;color:#edf2f5;border-color:#52616b}html[data-theme="dark"] .eyebrow{color:#a9c5af}html[data-theme="dark"] header p,html[data-theme="dark"] .list-head,html[data-theme="dark"] .empty,html[data-theme="dark"] footer{color:#aab9c0}html[data-theme="dark"] .list-head span:first-child,html[data-theme="dark"] .empty strong{color:#d9e5e1}html[data-theme="dark"] input:not([type="checkbox"]){background:#151e24;color:#edf2f5;border-color:#52616b}html[data-theme="dark"] li{border-color:#394750}html[data-theme="dark"] li.done label{color:#aab9c0}html[data-theme="dark"] .delete{color:#b6c2c7}html[data-theme="dark"] .delete:hover{background:#493039;color:#ffd2d2}
</style>
</head>
<body><main><header><div class="header-top"><div class="eyebrow">Немного порядка на каждый день</div><button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Тёмная тема</button></div><h1>Мои задачи<span style="color:#7ca989">.</span></h1><p>Запишите, что нужно сделать, и двигайтесь в своём темпе</p></header><section class="card" aria-label="Список задач"><form id="form"><input id="task" aria-label="Новая задача" placeholder="Что нужно сделать?" maxlength="300" autocomplete="off" required><button>Добавить</button></form><div class="list-head"><span>СПИСОК ЗАДАЧ</span><span id="count"></span></div><ul id="list"></ul><div id="empty" class="empty"><strong>Здесь пока пусто</strong>Добавьте первую задачу выше</div></section><footer>Ваши задачи сохраняются на этом устройстве</footer></main>
<script>
const form=document.querySelector('#form'), input=document.querySelector('#task'), list=document.querySelector('#list'), empty=document.querySelector('#empty'), count=document.querySelector('#count');
const themeButton=document.querySelector('#theme-toggle');
let theme='light';
try { if(localStorage.getItem('theme')==='dark') theme='dark' } catch {}
function applyTheme(){document.documentElement.dataset.theme=theme;themeButton.textContent=theme==='dark'?'Светлая тема':'Тёмная тема';themeButton.setAttribute('aria-pressed',String(theme==='dark'))}
themeButton.onclick=()=>{theme=theme==='dark'?'light':'dark';try{localStorage.setItem('theme',theme)}catch{}applyTheme()};
applyTheme();
let tasks=[];
try { const saved=JSON.parse(localStorage.getItem('my-tasks')||'[]'); if(Array.isArray(saved)) tasks=saved.filter(t=>typeof t.text==='string'&&typeof t.done==='boolean'); } catch {}
function render(){list.replaceChildren();for(const [index,task] of tasks.entries()){const li=document.createElement('li'), check=document.createElement('input'), label=document.createElement('label'), del=document.createElement('button');li.classList.toggle('done',task.done);check.type='checkbox';check.checked=task.done;check.id='task-'+index;check.setAttribute('aria-label','Отметить задачу: '+task.text);check.onchange=()=>{task.done=check.checked;save()};label.htmlFor=check.id;label.textContent=task.text;del.className='delete';del.type='button';del.textContent='×';del.setAttribute('aria-label','Удалить задачу: '+task.text);del.onclick=()=>{tasks.splice(index,1);save()};li.append(check,label,del);list.append(li)}empty.hidden=tasks.length>0;count.textContent=tasks.filter(t=>!t.done).length+' осталось'}
function save(){try{localStorage.setItem('my-tasks',JSON.stringify(tasks))}catch{alert('Не удалось сохранить задачи на устройстве')}render()}
form.onsubmit=e=>{e.preventDefault();const text=input.value.trim();if(!text)return;tasks.push({text,done:false});input.value='';save();input.focus()};render();
</script></body></html>
